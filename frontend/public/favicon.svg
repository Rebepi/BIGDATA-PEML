<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado con borde moderno -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Escudo Institucional Perú con Gráfico de Crecimiento -->
  <g filter="url(#shadow)">
    <clipPath id="shieldClip">
      <path d="M32 10 L48 16 C48 34 32 46 32 46 C32 46 16 34 16 16 Z"/>
    </clipPath>
    
    <g clip-path="url(#shieldClip)">
      <!-- Franja Roja Izquierda -->
      <rect x="16" y="10" width="10.66" height="36" fill="url(#redGrad)"/>
      <!-- Franja Blanca Central -->
      <rect x="26.66" y="10" width="10.66" height="36" fill="#ffffff"/>
      <!-- Franja Roja Derecha -->
      <rect x="37.33" y="10" width="10.67" height="36" fill="url(#redGrad)"/>
      
      <!-- Barras de análisis financiero -->
      <rect x="28.5" y="26" width="3" height="7" rx="1" fill="#0f172a"/>
      <rect x="32.5" y="21" width="3" height="12" rx="1" fill="#0f172a"/>
    </g>
    
    <!-- Borde Dorado del Escudo -->
    <path d="M32 10 L48 16 C48 34 32 46 32 46 C32 46 16 34 16 16 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Punto de estado 'En Vivo' -->
  <circle cx="50" cy="50" r="4" fill="#10b981"/>
  <circle cx="50" cy="50" r="6" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
</svg>
